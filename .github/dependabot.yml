version: 2

# Every action is pinned to a full commit SHA; the base image is pinned by
# digest. Both freeze security fixes, so something has to propose the bumps.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"

  # The base Dockerfile's FROM digest. The Claude layer's FROM is a build
  # argument, which Dependabot skips harmlessly.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(image)"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
